name: GAS CI/CD

on:
  pull_request:
    paths:
      - 'gas/**'
      - '.github/workflows/gas-cicd.yml'
  push:
    branches:
      - main
    paths:
      - 'gas/**'
      - '.github/workflows/gas-cicd.yml'
  workflow_dispatch:

concurrency:
  group: gas-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build GAS backend (TypeScript -> JavaScript)
        run: npm run build

      - name: Install clasp
        run: npm i -g @google/clasp

      - name: Validate GAS sources
        run: |
          node --check gas/Code.js
          test -f gas/appsscript.json
          clasp --version

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build GAS backend (TypeScript -> JavaScript)
        run: npm run build

      - name: Install clasp
        run: npm i -g @google/clasp

      - name: Prepare clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "Missing required secrets: CLASPRC_JSON / GAS_SCRIPT_ID"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          cat > gas/.clasp.json <<EOF
          {
            "scriptId": "$GAS_SCRIPT_ID",
            "rootDir": "./"
          }
          EOF

      - name: Push and deploy GAS
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          cd gas
          clasp push --force
          clasp version "ci-${GITHUB_SHA}"
          if [ -n "$GAS_DEPLOYMENT_ID" ]; then
            clasp deploy -i "$GAS_DEPLOYMENT_ID" -d "ci-${GITHUB_SHA}"
          else
            clasp deploy -d "ci-${GITHUB_SHA}"
          fi
